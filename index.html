function registerRows(){const q=state.query.toLowerCase(),rows=db.docs.filter(d=>`${d.number} ${d.to} ${d.from} ${d.purpose} ${d.reference} ${d.items?.map(i=>i.description).join(' ')}`.toLowerCase().includes(q)&&(!state.filter||d.status===state.filter)).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const body=document.getElementById('register-body');if(body)body.innerHTML=rows.length?rows.map(d=>`<tr><td><strong class="mono">${escapeHTML(d.number||'Unnumbered')}</strong><div class="micro muted">${dateText(d.date)} · ${escapeHTML(d.purpose||'')}</div></td><td><strong>${escapeHTML(d.to||'-')}</strong><div class="micro muted">From ${escapeHTML(d.from||'-')}</div></td><td>${escapeHTML(d.items?.[0]?.description||'-')}${d.items?.length>1?` <span class="muted">+${d.items.length-1}</span>`:''}</td><td class="right">${qtyfmt(totals(d).quantity)}<div class="micro muted">${qtyfmt(totals(d).weight)} kg</div></td><td class="right"><strong>${money(totals(d).total)}</strong></td><td><select aria-label="Status for ${escapeHTML(d.number)}" data-status-id="${escapeHTML(d.id)}" style="border:1px solid var(--line);border-radius:99px;padding:5px;font-size:9px;background:#fff"><option ${d.status==='Draft'?'selected':''}>Draft</option><option ${d.status==='Issued'?'selected':''}>Issued</option><option ${d.status==='Delivered'?'selected':''}>Delivered</option><option ${d.status==='Cancelled'?'selected':''}>Cancelled</option></select></td><td class="right"><button class="btn btn-light btn-sm" data-action="open-doc" data-id="${escapeHTML(d.id)}">Open</button><button class="btn btn-quiet btn-sm" data-action="print-doc" data-id="${escapeHTML(d.id)}">Print</button></td></tr>`):`<tr><td colspan="7"><div class="empty">No challans match these filters.</div></td></tr>`;const count=document.getElementById('register-count');if(count)count.textContent=`${rows.length} of ${db.docs.length} records`}
function register(){return `<div class="page-head"><div><h3>DC register</h3><p>Search dispatches, track status and reopen a saved challan.</p></div><div class="button-row"><button class="btn btn-primary" data-action="new">+ New challan</button></div></div><section class="card card-pad"><div class="toolbar"><div class="filters"><input id="register-search" placeholder="Search number, party, part or reference" value="${escapeHTML(state.query)}"><select id="register-filter"><option value="">All statuses</option>${['Draft','Issued','Delivered','Cancelled'].map(x=>`<option ${state.filter===x?'selected':''}>${x}</option>`).join('')}</select></div><span id="register-count" class="micro muted">${db.docs.length} records</span></div><div class="table-wrap"><table><thead><tr><th>Challan</th><th>Destination</th><th>Material / part</th><th class="right">Quantity</th><th class="right">Value</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody id="register-body"></tbody></table></div></section>`}

ue="">Manual</option>${db.products.map(p=>`<option value="${escapeHTML(p.id)}" ${p.id===i.productId?'selected':''}>${escapeHTML(p.partNo||p.description)}</option>`).join('')}</select></td><td><input class="desc-input" data-item="${n}" data-key="description" value="${escapeHTML(i.description)}" placeholder="Item description"></td><td><input data-item="${n}" data-key="partNo" value="${escapeHTML(i.partNo)}" placeholder="Part no."></td><td><input type="number" min="0" step="any" data-item="${n}" data-key="qty" value="${escapeHTML(i.qty)}"></td><td><input type="number" min="0" step="any" data-item="${n}" data-key="receivedQty" value="${escapeHTML(i.receivedQty)}" placeholder="optional"></td><td><input class="rate-input" type="number" min="0" step="any" data-item="${n}" data-key="rate" value="${escapeHTML(i.rate)}"></td><td class="right mono" id="amount-${n}">${plainAmount(num(i.qty)*num(i.rate))}</td><td><button class="remove-row" data-action="remove-item" data-index="${n}" aria-label="Remove row">&times;</button></td></tr>`).join('')}</tbody></table></div><div class="button-row" style="margin-top:10px"><button class="btn btn-light btn-sm" data-view="items">Manage item master</button><span class="help">Amount = quantity x rate. Enter received quantities to calculate shortage from dispatch vs receipt.</span></div></section><section class="card card-pad"><div class="panel-title"><div><h4>Shortage & transport details</h4><p>Shortage is calculated from received quantities when provided; otherwise enter the shortage values below.</p></div></div><div class="form-grid cols-3"><div class="field"><label>Shortage quantity${sh.calculated?' · calculated':''}</label><input type="number" min="0" step="any" data-field="shortageQty" value="${sh.calculated?qtyfmt(sh.qty):escapeHTML(d.shortageQty)}" ${sh.calculated?'disabled':''}></div><div class="field"><label>Shortage amount (Rs.)${sh.calculated?' · calculated':''}</label><input type="number" min="0" step="any" data-field="shortageAmount" value="${sh.calculated?sh.amount:escapeHTML(d.shortageAmount)}" ${sh.calculated?'disabled':''}></div><div class="field"><label>Vehicle / transport reference</label><input data-field="vehicle" value="${escapeHTML(d.vehicle)}" placeholder="Vehicle, porter or reference"></div><div class="field"><label>Transporter</label><input data-field="transporter" value="${escapeHTML(d.transporter)}"></div><div class="field"><label>Driver / contact</label><input data-field="driver" value="${escapeHTML(d.driver)}"></div><div class="field"><label>LR / consignment no.</label><input data-field="lr" value="${escapeHTML(d.lr)}"></div><div class="field"><label>E-way bill no.</label><input data-field="eway" value="${escapeHTML(d.eway)}"></div><div class="field"><label>Transport mode</label><select data-field="mode"><option value="">Select mode</option>${['Road','Rail','Air','Ship','Hand delivery','Other'].map(x=>`<option ${d.mode===x?'selected':''}>${x}</option>`).join('')}</select></div></div></section></div><aside class="stack"><section class="summary-card" id="totals-box">${summaryMarkup(d,t)}</section><section class="card card-pad"><div class="panel-title"><div><h4>KGR FABTEK DC preview</h4><p>Same current form data feeds the PDF.</p></div><button class="btn btn-light btn-sm" data-action="print">Print / PDF</button></div><div id="live-preview">${kgrDocForPrint(d)}</div></section></aside></div>`}
function customersView(){const f=state.customerDraft;return `<div class="page-head"><div><h3>Customer master</h3><p>Saved customer details fill new DCs. Editing a DC changes only that DC's customer snapshot.</p></div><button class="btn btn-primary" data-action="new-customer">+ Add customer</button></div><div class="grid grid-2"><section class="card card-pad"><div class="panel-title"><div><h4>Saved customers</h4><p>${db.customers.length} customer records</p></div></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Address</th><th>GSTIN</th><th></th></tr></thead><tbody>${db.customers.length?db.customers.map(c=>`<tr><td><strong>${escapeHTML(c.name)}</strong><div class="micro muted">${escapeHTML(c.contact||'')}</div></td><td>${escapeHTML([c.address1,c.address2,c.city,c.pin].filter(Boolean).join(', '))}</td><td class="mono">${escapeHTML(c.gstin||'-')}</td><td class="right"><button class="btn btn-light btn-sm" data-action="edit-customer" data-id="${escapeHTML(c.id)}">Edit</button></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty"><strong>No saved customers yet</strong>Add a customer here, then select it on a new DC.</div></td></tr>`}</tbody></table></div></section><section class="card card-pad">${f?`<div class="panel-title"><div><h4>${f.id?'Edit':'Add'} customer</h4><p>Save explicitly to update the customer master.</p></div></div><div class="form-grid">${[['name','Company name'],['address1','Address line 1'],['address2','Address line 2'],['city','City'],['pin','PIN code'],['gstin','GSTIN'],['contact','Contact name / other detail'],['phone','Phone']].map(([k,l])=>`<div class="field ${k==='address1'||k==='address2'?'full':''}"><label>${l}</label><input data-customer-field="${k}" value="${escapeHTML(f[k]||'')}"></div>`).join('')}</div><div class="button-row" style="margin-top:14px"><button class="btn btn-primary" data-action="save-customer">Save customer master</button><button class="btn btn-light" data-action="cancel-customer">Cancel</button></di function refreshEditor(){const t=totals(state.doc),box=document.getElementById('totals-box'),preview=document.getElementById('live-preview');if(box)box.innerHTML=summaryMarkup(state.doc,t);if(preview)preview.innerHTML=renderKgrDoc(state.doc);document.getElementById('print-root').innerHTML=renderKgrDoc(state.doc);const sh=shortage(state.doc),sq=document.querySelector('[data-field="shortageQty"]'),sa=document.querySelector('[data-field="shortageAmount"]');if(sq&&sh.calculated)sq.value=qtyfmt(sh.qty);if(sa&&sh.calculated)sa.value=sh.amount;document.querySelectorAll('[data-field="shortageQty"],[data-field="shortageAmount"]').forEach(el=>el.disabled=sh.calculated);t.items.forEach((it,i)=>{const cell=document.getElementById(`amount-${i}`);if(cell)cell.textContent=plainAmount(it.amount)})}
function startNew(){state.doc=db.draft||makeDoc();state.view='editor';render();window.scrollTo({top:0,behavior:'smooth'})}
function saveDoc(status){const d=state.doc;if(d.id&&d.status!=='Draft'){toast('Finalized challans are locked. Create an amendment draft to make a correction.');return false}d.customerName=String(d.customerName||d.to||'').trim();d.to=d.customerName;if(!d.from.trim()||!d.customerName||!d.date||!d.purpose.trim()){toast('Enter a dispatch location, customer, date and purpose first.');return false}if(!d.items.some(i=>String(i.description||'').trim()&&num(i.qty)>0)){toast('Add at least one part with a description and quantity.');return false}d.number=String(d.number||'').trim()||proposedNumber();if(db.docs.some(x=>x.number===d.number&&x.id!==d.id)){toast('That DC number is already in use.');return false}const now=new Date().toISOString();if(!d.id){d.id=uid();d.createdAt=now;d.companySnapshot=structuredClone(db.company);db.company.nextNumber=Math.max(1,Math.floor(num(db.company.nextNumber)))+1;db.docs.unshift(structuredClone(d));db.draft=null}else{d.updatedAt=now;const index=db.docs.findIndex(x=>x.id===d.id);if(index<0)db.docs.unshift(structuredClone(d));else db.docs[index]=structuredClone(d)}if(status)d.status=status;else if(!d.status)d.status='Draft';const index=db.docs.findIndex(x=>x.id===d.id);if(index>=0)db.docs[index]=structuredClone(d);persist();render();toast(status==='Issued'?'Challan issued.':'Challan saved.');return true}
function printDoc(d){const saved=db.docs.find(x=>x.id===d.id);const source=saved?normalizeDoc(saved):normalizeDoc(d);document.getElementById('print-root').innerHTML=renderKgrDoc(source);window.print()}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('smart-dc-backup.json',JSON.stringify({app:'SMART DC',version:2,exportedAt:new Date().toISOString(),company:db.company,customers:db.customers,products:db.products,docs:db.docs,draft:db.draft},null,2),'application/json');toast('Backup downloaded.')}
function applyCustomer(id){if(!id)return;const c=db.customers.find(x=>x.id===id);if(!c)return;Object.assign(state.doc,{customerId:c.id,customerName:c.name,to:c.name,customerAddress1:c.address1||'',customerAddress2:c.address2||'',customerCity:c.city||'',customerPin:c.pin||'',customerGstin:c.gstin||'',customerContact:c.contact||c.phone||''})}
function applyProduct(index,id){const row=state.doc.items[index];if(!row)return;row.productId=id||'';const p=db.products.find(x=>x.id===id);if(p)Object.assign(row,{description:p.description||'',partNo:p.partNo||'',hsn:p.hsn||'',unit:p.unit||'PCS',rate:num(p.rate)})}
function saveCustomerMaster(){const c=state.customerDraft;if(!c?.name?.trim()){toast('Enter the customer company name.');return}const value={...c,name:c.name.trim()};if(value.id){const i=db.customers.findIndex(x=>x.id===value.id);if(i>=0)db.customers[i]=value;else db.customers.push(value)}else{value.id=uid();db.customers.push(value)}state.customerDraft=null;localStorage.setItem(STORE,JSON.stringify(db));toast('Customer master saved. Existing DCs were not changed.');render()}
function saveProductMaster(){const p=state.productDraft;if(!p?.description?.trim()){toast('Enter an item description.');return}const value={...p,description:p.description.trim(),rate:Math.max(0,num(p.rate))};if(value.id){const i=db.products.findIndex(x=>x.id===value.id);if(i>=0)db.products[i]=value;else db.products.push(value)}else{value.id=uid();db.products.push(value)}state.productDraft=null;localStorage.setItem(STORE,JSON.stringify(db));toast('Item master saved. Existing DC rows were not changed.');render()}
function editDoc(id){const found=db.docs.find(x=>x.id===id);if(!found)return;state.doc=normalizeDoc(found);state.view='editor';render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='new'){startNew();return}if(a==='save'){saveDoc();return}if(a==='issue'){if(saveDoc('Issued'))printDoc(state.doc);return}if(a==='print'){if(!state.doc.id&&!saveDoc('Draft'))return;printDoc(state.doc);return}
if(a==='add-item'){state.doc.items.push(blankItem());persist();render();return}if(a==='remove-item'){if(state.doc.items.length===1){toast('A challan needs at least one line.');return}state.doc.items.splice(num(b.dataset.index),1);persist();render();return}
if(a==='open-doc'){editDoc(b.dataset.id);return}if(a==='print-doc'){const found=db.docs.find(x=>x.id===b.dataset.id);if(found)printDoc(found);return}
if(a==='close-modal'){state.confirm=null;renderModal();return}if(a==='confirm'){const action=state.confirm?.action;if(action==='clear'){db.docs=[];db.draft=null;state.doc=makeDoc();persist();toast('Saved challans deleted.')}if(action==='import'){const x=state.importData;if(x){db.company={...initialDb().company,...x.company};db.docs=x.docs.map(d=>({...d,id:d.id||uid(),items:d.items||[blankItem()]}));db.draft=x.draft||null;state.doc=db.draft||makeDoc();toast('Backup restored.')}delete state.importData}state.confirm=null;render();return}
if(a==='clear-records'){state.confirm={action:'clear',title:'Delete all saved challans?',text:'This cannot be undone. Download a JSON backup first if you may need these records.',button:'Delete all'};renderModal();return}
if(a==='export-json'){exportJSON();return}if(a==='export-csv'){exportCSV();return}if(a==='import-json'){document.getElementById('import-file').click();return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('#register-search')){state.query=el.value;registerRows();return}if(el.matches('[data-field]')){const key=el.dataset.field;state.doc[key]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':num(el.value)):el.value;if(key==='taxable'){const rate=document.querySelector('[data-field="taxRate"]');if(rate)rate.disabled=!el.checked}persist();refreshEditor();return}if(el.matches('[data-item]')){const item=state.doc.items[num(el.dataset.item)],key=el.dataset.key;if(item){item[key]=el.type==='number'?(el.value===''?'':num(el.value)):el.value;persist();refreshEditor()}return}if(el.matches('[data-company]')){const key=el.dataset.company;db.company[key]=el.type==='number'?num(el.value):el.value;try{localStorage.setItem(STORE,JSON.stringify(db))}catch{}if(state.view==='editor')refreshEditor();return}if(el.matches('[data-list]')){db.company[el.dataset.list]=el.value.split('\n').map(x=>x.trim()).filter(Boolean);try{localStorage.setItem(STORE,JSON.stringify(db))}catch{}}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('#register-filter')){state.filter=el.value;registerRows();return}if(el.matches('[data-status-id]')){const d=db.docs.find(x=>x.id===el.dataset.statusId);if(d){d.status=el.value;d.updatedAt=new Date().toISOString();persist();render();toast(`Status updated to ${d.status}.`)}return}if(el.matches('[data-company], [data-list]')){render();return}if(el.matches('[data-field]')){persist();refreshEditor()}});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const data=JSON.parse(await file.text());if(!data.company||!Array.isArray(data.docs))throw new Error('Invalid backup');state.importData=data;state.confirm={action:'import',title:'Restore this backup?',text:`This will replace the current company settings and ${db.docs.length} saved challans with ${data.docs.length} challans from ${file.name}.`,button:'Restore backup'};renderModal()}catch{toast('That file is not a valid SMART DC backup.')}});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field="customerName"]')){state.doc.to=el.value;persist();return}if(el.matches('[data-field="customerId"]')){applyCustomer(el.value);persist();render();return}if(el.matches('[data-item-product]')){applyProduct(num(el.dataset.itemProduct),el.value);persist();render();return}if(el.matches('[data-customer-field]')&&state.customerDraft){state.customerDraft[el.dataset.customerField]=el.value;return}if(el.matches('[data-product-field]')&&state.productDraft){state.productDraft[el.dataset.productField]=el.dataset.productField==='rate'?num(el.value):el.value;return}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='new-customer'){state.customerDraft={name:'',address1:'',address2:'',city:'',pin:'',gstin:'',contact:'',phone:''};state.view='customers';render();return}if(a==='edit-customer'){state.customerDraft=structuredClone(db.customers.find(x=>x.id===b.dataset.id));state.view='customers';render();return}if(a==='save-customer'){saveCustomerMaster();return}if(a==='cancel-customer'){state.customerDraft=null;render();return}if(a==='new-product'){state.productDraft={partNo:'',description:'',hsn:'',unit:'PCS',rate:0};state.view='items';render();return}if(a==='edit-product'){state.productDraft=structuredClone(db.products.find(x=>x.id===b.dataset.id));state.view='items';render();return}if(a==='save-product'){saveProductMaster();return}if(a==='cancel-product'){state.productDraft=null;render();return}if(a==='apply-customer'){applyCustomer(state.doc.customerId);persist();render();return}if(a==='amend'){state.confirm={action:'amend',id:state.doc.id,title:'Create an amendment draft?',text:`${state.doc.number} will remain unchanged and read-only. A separate draft copy will be created.`,button:'Create amendment'};renderModal()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="confirm"]');if(!b||!['amend','import'].includes(state.confirm?.action))return;e.preventDefault();e.stopImmediatePropagation();if(state.confirm.action==='amend'){const reason=document.querySelector('[data-amend-reason]')?.value.trim();if(!reason){toast('Enter the reason for this amendment.');return}const original=db.docs.find(x=>x.id===state.confirm.id);if(!original){toast('The finalized challan could not be found.');state.confirm=null;render();return}const copy=normalizeDoc(original);copy.id='';copy.number='';copy.status='Draft';copy.date=localDate();copy.amendsId=original.id;copy.amendmentReason=reason;copy.createdAt='';copy.updatedAt='';state.doc=copy;state.confirm=null;state.view='editor';persist();render();toast('Amendment draft created. The finalized DC is unchanged.')}else{const x=state.importData;db.company={...initialDb().company,...x.company};db.customers=Array.isArray(x.customers)?x.customers:[];db.products=Array.isArray(x.products)?x.products:[];db.docs=x.docs.map(normalizeDoc);db.draft=x.draft?normalizeDoc(x.draft):null;state.doc=normalizeDoc(db.draft||makeDoc());state.confirm=null;localStorage.setItem(STORE,JSON.stringify(db));toast('Backup restored.');render()}},true);
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-status-id]'))return;const d=db.docs.find(x=>x.id===el.dataset.statusId);if(d&&d.status!=='Draft'&&el.value==='Draft'){e.stopImmediatePropagation();el.value=d.status;toast('A finalized challan cannot be reverted to draft. Create an amendment instead.')}},true);
window.addEventListener('beforeunload',()=>persist());
render();
function exportCSV(){const rows=[['Challan','Date','Status','From','Customer','Address 1','Address 2','City','PIN','GSTIN','Project','SO number','Invoice number','Purpose','Shortage qty','Shortage amount','Vehicle / transport ref','Part number','Description','HSN','Quantity','Received qty','Unit','Weight kg','Rate INR','Amount INR']];db.docs.forEach(d=>(d.items||[]).forEach(i=>rows.push([d.number,d.date,d.status,d.from,d.customerName||d.to,d.customerAddress1,d.customerAddress2,d.customerCity,d.customerPin,d.customerGstin,d.projectName,d.soNumber,d.invoiceNumber,d.purpose,shortage(d).qty,shortage(d).amount,d.vehicle,i.partNo,i.description,i.hsn,i.qty,i.receivedQty,i.unit,i.weight,i.rate,num(i.qty)*num(i.rate)])));const csv=rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`}).join(',')).join('\r\n');download('smart-dc-register.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Register exported.')}
function enhancePrintDocs(d){document.querySelectorAll('#live-preview .doc-preview,#print-root .doc-preview').forEach(root=>{const terms=[...root.querySelectorAll('.doc-terms')].find(el=>!el.querySelector('b'));if(terms)terms.textContent=db.company.terms||'Goods described above are sent for the stated purpose.';const contact=root.querySelector('.doc-parties div:nth-child(2) p');if(contact)contact.textContent=contact.textContent.split('\n').filter(line=>!line.trim().startsWith('Attn:')).join('\n');const transporter=[...root.querySelectorAll('.doc-meta>div')].find(el=>el.querySelector('label')?.textContent==='Transporter');if(transporter){let carrier=root.querySelector('.doc-carrier');if(!carrier){carrier=document.createElement('div');carrier.className='doc-carrier';carrier.innerHTML='<label>Mode / driver</label><strong></strong>';transporter.after(carrier)}carrier.querySelector('strong').textContent=[d.mode,d.driver].filter(Boolean).join(' / ')||'-'}})}
</script>
